services:
  lwss-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lwss-gumma-portal
    ports:
      - "3000:80"
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
